# Offline tests for the cop launcher, the guardrail hook, and the friction report, on Windows
# and macOS.
# The live smoke test (tests/smoke.ps1) needs a signed-in Copilot CLI and premium requests,
# so it runs on your own machine, not here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell version
        run: $PSVersionTable.PSVersion.ToString()
      - name: Parse every script
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1, *.psd1, *.example -File) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $bad++; Write-Output "$($f.FullName): $($errs.Message -join '; ')" }
          }
          if ($bad) { exit 1 }
      - name: Skill frontmatter
        # Copilot skips a skill whose frontmatter isn't valid YAML; an unquoted ": " in the
        # description is the easy mistake.
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem home -Recurse -Filter SKILL.md -File) {
            $lines = @(Get-Content $f.FullName)
            $end = [Array]::IndexOf($lines, '---', 1)
            $front = if ($lines[0] -eq '---' -and $end -gt 0) { $lines[1..($end - 1)] } else { @() }
            $name = $front | Where-Object { $_ -match '^name: (.+)$' } | ForEach-Object { $Matches[1] }
            $desc = $front | Where-Object { $_ -match '^description: (.+)$' } | ForEach-Object { $Matches[1] }
            $why = if (-not $front) { 'no frontmatter' }
              elseif ($name -ne $f.Directory.Name) { "name '$name' differs from its folder" }
              elseif (-not $desc) { 'no description' }
              elseif ($desc -notmatch '^["'']' -and $desc -match ': |^[\[{>|*&!%@`#-]|\s#') { 'description needs quoting (": ", " #", or a leading special character)' }
            if ($why) { $bad++; Write-Output "$($f.FullName): $why" }
          }
          if ($bad) { exit 1 }
      - name: Launcher tests
        run: ./tests/cop.ps1
      - name: Hook tests
        run: ./tests/hook.ps1
      - name: Report tests
        run: ./tests/report.ps1
      - name: tf-check tests
        run: ./tests/tfcheck.ps1
      - name: Install dry run
        run: ./scripts/install.ps1 -DryRun
